name: Enterprise CI/CD Pipeline - AI-CHD-CDSS

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_chd_secure_pwd
          POSTGRES_DB: chd_cdss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run Ruff Linter & Syntax Check
        run: |
          ruff check .

      - name: Run Pytest Suite & Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres_chd_secure_pwd@localhost:5432/chd_cdss
          JWT_SECRET_KEY: ci_cd_test_secret_key_12345
        run: |
          pytest tests/ --cov=backend --cov-report=term-missing

  docker-build:
    name: Multi-Stage Docker Container Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: ai-chd-cdss-backend:latest

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ai-chd-cdss-frontend:latest
