services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI REST Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: chd-cdss-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: AI-CHD-CDSS
      - key: DATABASE_URL
        fromDatabase:
          name: chd-cdss-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://chd-frontend.onrender.com,https://chd-cdss-frontend.onrender.com,http://localhost:3000"

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: chd-cdss-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chd-cdss-backend.onrender.com

databases:
  # ----------------------------------------------------------------------------
  # 3. Managed PostgreSQL Production Database
  # ----------------------------------------------------------------------------
  - name: chd-cdss-postgres
    region: oregon
    plan: free
    databaseName: chd_cdss
    user: postgres_chd_user
