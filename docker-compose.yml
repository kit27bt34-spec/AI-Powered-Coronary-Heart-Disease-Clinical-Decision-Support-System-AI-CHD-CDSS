version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_chd_secure_pwd
      POSTGRES_DB: chd_cdss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chd_cdss"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chd_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chd_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENV: production
      DATABASE_URL: postgresql://postgres:postgres_chd_secure_pwd@postgres:5432/chd_cdss
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: prod_super_secret_chd_jwt_signing_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chd_celery_worker
    restart: always
    command: celery -A backend.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres_chd_secure_pwd@postgres:5432/chd_cdss
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chd_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
